name: Publish Docker image (GHCR)
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
jobs:
  # ── PORTE DE TEST ──────────────────────────────────────────────────────────
  # Ajoutée le 2026-11-27. Jusqu'à cette date AUCUN workflow de ce dépôt n'exécutait
  # Maven, et le Dockerfile construit avec -Dmaven.test.skip=true : rien n'exécutait les
  # tests, nulle part. Sa première exécution a trouvé deux défauts réels — la
  # documentation de l'API servie publiquement en production, et une violation de la règle
  # hexagonale — plus trois tests d'intégration portant un nom de test unitaire.
  #
  # `build` dépend de ce job, donc aucune image n'est publiée si les tests échouent, et
  # comme deploy.yml se déclenche sur le succès de la publication, rien ne se déploie non
  # plus. Pour déployer sans attendre une image DÉJÀ publiée, utiliser le
  # workflow_dispatch de deploy.yml.
  tests:
    if: github.repository == 'yowyob/tiibntick-core'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Récupérer les jars du kernel (RT-comops)
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          mkdir -p ~/.m2/repository
          gh release download latest -R yowyob/kernel-core-m2 -p 'rt-comops-m2.tgz' -O rt-comops-m2.tgz
          tar xzf rt-comops-m2.tgz -C ~/.m2/repository
      # Les quatre classes exclues ne sont pas des tests unitaires malgré leur nom, donc
      # surefire les ramasse alors qu'elles ne peuvent pas passer ici :
      #
      #   WalletAutoProvisioningWiringTest, TiiBnTickApplicationTest, PublicPathsSecurityTest
      #     @SpringBootTest sous les profils `test, r2dbc`, qui démarrent le contexte
      #     applicatif entier. application-r2dbc.yml le dit lui-même : « la base
      #     tiibntick_core est déjà provisionnée par la stack Docker ». Elles exigent
      #     Postgres sur 5433, Redis, Kafka et MinIO, c'est-à-dire un `docker compose up -d`
      #     local. Ici elles échouent sur « Unable to connect to Redis ».
      #     DETTE : à renommer en *IntegrationTest et à passer sous failsafe avec
      #     Testcontainers, qui fournirait cette infrastructure. Décision du propriétaire
      #     du module (L7 bootstrap).
      #
      #   LayeringArchitectureTest
      #     Échoue sur une violation RÉELLE et préexistante, pas sur l'environnement : la
      #     couche `application` dépend de DTO de `adapter.in.web` dans gofreelancer et
      #     agency. 1 244 occurrences — le chiffre a d'abord été annoncé à « une quinzaine »
      #     d'après les premières lignes tronquées du journal, c'est faux. Exclu d'ici pour
      #     ne pas bloquer tout déploiement sur une dette qui n'est pas de ce chantier, mais
      #     exécuté plus bas pour rester visible à chaque exécution.
      #
      #   Les trois essais Spring Boot qui figuraient ici (WalletAutoProvisioningWiringTest,
      #   TiiBnTickApplicationTest, PublicPathsSecurityTest) sont renommés *IntegrationTest
      #   côté dépôt mère et exclus ici par MOTIF, plus par nom de classe : une liste de noms
      #   pourrit — le prochain essai du même genre n'y serait pas, et la porte deviendrait
      #   rouge pour une raison étrangère au changement examiné.
      #
      #   Le motif est indispensable : `-Dtest` SUPPLANTE les <includes>/<excludes> du pom,
      #   donc l'exclusion `**/*IntegrationTest.java` configurée dans le pom racine ne
      #   s'applique PAS dès que cette ligne existe. Vérifié dans les deux sens le 27/11/2026
      #   — sans le motif, 12 erreurs (10 + 1 + 1) faute de Postgres/Redis/Kafka ; avec, 43
      #   essais verts sur tnt-bootstrap. Avoir validé localement un `mvn test` SANS -Dtest
      #   avait masqué exactement cette différence.
      - name: Tests unitaires (tous les modules)
        run: >
          mvn -B -ntp test
          -Dtest='!LayeringArchitectureTest,!*IntegrationTest'
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Publier les rapports de test en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-de-test
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

  # ── PORTE LIQUIBASE, BLOQUANTE ─────────────────────────────────────────────
  # Vue verte pour la première fois le 27/11/2026 (2 essais, 18,32 s) : elle passe donc
  # bloquante, comme le prévoyait la note laissée dans la section « dette ». Un changelog
  # cassé ne doit pas pouvoir produire une image — c'est ce qui fait tomber l'application au
  # démarrage, pas à la compilation. Le changeset 004 avait été livré sans jamais passer ici.
  liquibase:
    if: github.repository == 'yowyob/tiibntick-core'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Récupérer les jars du kernel (RT-comops)
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          mkdir -p ~/.m2/repository
          gh release download latest -R yowyob/kernel-core-m2 -p 'rt-comops-m2.tgz' -O rt-comops-m2.tgz
          tar xzf rt-comops-m2.tgz -C ~/.m2/repository
      - name: Porte Liquibase sur PostGIS (Testcontainers)
        # Commande du CLAUDE.md, qui l'appelle « la porte de production ». -am est requis,
        # sinon des jars périmés de ~/.m2 sont utilisés et le test valide un changelog qui
        # n'est pas celui du commit.
        #
        # -Dit.test restreint failsafe à cette seule classe : depuis le renommage des trois
        # essais Spring Boot en *IntegrationTest, failsafe les prendrait sinon aussi, et ils
        # exigent Postgres, Redis et Kafka.
        run: >
          mvn -B -ntp verify -Pintegration-tests -pl tnt-bootstrap -am
          -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false
          -Dit.test=LiquibaseMasterChangelogIntegrationTest
          -Dfailsafe.failIfNoSpecifiedTests=false
      - name: Publier les rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-liquibase
          path: |
            **/target/failsafe-reports/**
          retention-days: 7

  # ── DETTE VISIBLE, NON BLOQUANTE ───────────────────────────────────────────
  # Tourne à chaque publication et apparaît en rouge sans rien bloquer. À basculer en
  # `needs` de `build` le jour où la violation est résorbée — la porte Liquibase, elle, l'a
  # été dès qu'elle a été vue verte (voir la tâche ci-dessus).
  dette:
    if: github.repository == 'yowyob/tiibntick-core'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Récupérer les jars du kernel (RT-comops)
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          mkdir -p ~/.m2/repository
          gh release download latest -R yowyob/kernel-core-m2 -p 'rt-comops-m2.tgz' -O rt-comops-m2.tgz
          tar xzf rt-comops-m2.tgz -C ~/.m2/repository
      - name: Règle de superposition des modules (violation connue)
        continue-on-error: true
        run: >
          mvn -B -ntp test -pl tnt-bootstrap -am
          -Dtest=LayeringArchitectureTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-dette
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

  build:
    needs: [tests, liquibase]
    if: github.repository == 'yowyob/tiibntick-core'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les jars du kernel (RT-comops)
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          mkdir -p m2repo
          gh release download latest -R yowyob/kernel-core-m2 -p 'rt-comops-m2.tgz' -O rt-comops-m2.tgz
          tar xzf rt-comops-m2.tgz -C m2repo
          echo "jars RT-comops:"; ls m2repo/yowyob/comops/api | head
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
