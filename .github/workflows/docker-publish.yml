name: Publish Docker image (GHCR)
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
jobs:
  # ── PORTE DE TEST ──────────────────────────────────────────────────────────
  # Ajoutée le 2026-11-27. Jusqu'à cette date AUCUN workflow de ce dépôt n'exécutait
  # Maven, et le Dockerfile construit avec -Dmaven.test.skip=true : rien n'exécutait les
  # tests, nulle part. Le LiquibaseMasterChangelogIntegrationTest que le CLAUDE.md décrit
  # comme « la porte de production » n'était joué par personne, et il ne peut pas l'être
  # sur un poste sans démon Docker — Testcontainers y reste bloqué indéfiniment.
  #
  # `build` en dépend, donc aucune image n'est publiée si les tests échouent, et comme
  # deploy.yml se déclenche sur le succès de la publication, rien ne se déploie non plus.
  # Coût assumé : chaque publication attend cette porte. Pour déployer sans attendre une
  # image DÉJÀ publiée, utiliser le workflow_dispatch de deploy.yml.
  tests:
    if: github.repository == 'yowyob/tiibntick-core'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Récupérer les jars du kernel (RT-comops)
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          mkdir -p ~/.m2/repository
          gh release download latest -R yowyob/kernel-core-m2 -p 'rt-comops-m2.tgz' -O rt-comops-m2.tgz
          tar xzf rt-comops-m2.tgz -C ~/.m2/repository
      - name: Tests unitaires (tous les modules)
        run: mvn -B -ntp test
      - name: Porte Liquibase sur PostGIS (Testcontainers)
        # Commande du CLAUDE.md. -am est requis, sinon des jars périmés de ~/.m2 sont
        # utilisés et le test valide un changelog qui n'est pas celui du commit.
        run: >
          mvn -B -ntp verify -Pintegration-tests -pl tnt-bootstrap -am
          -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false
          -Dit.test=LiquibaseMasterChangelogIntegrationTest
          -Dfailsafe.failIfNoSpecifiedTests=false
      - name: Publier les rapports de test en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-de-test
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

  build:
    needs: tests
    if: github.repository == 'yowyob/tiibntick-core'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les jars du kernel (RT-comops)
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          mkdir -p m2repo
          gh release download latest -R yowyob/kernel-core-m2 -p 'rt-comops-m2.tgz' -O rt-comops-m2.tgz
          tar xzf rt-comops-m2.tgz -C m2repo
          echo "jars RT-comops:"; ls m2repo/yowyob/comops/api | head
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
