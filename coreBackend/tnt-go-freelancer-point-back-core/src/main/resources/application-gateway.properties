# Gateway Profile Configuration
spring.application.name=tiibntick-gateway

# Server
server.port=${GATEWAY_PORT:8080}

# Backend URL
tiibntick.backend.url=${BACKEND_URL:http://localhost:8081}

# Redis for rate limiting
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Gateway configuration
spring.cloud.gateway.default-filters[0]=AddResponseHeader=X-Powered-By, TiiBnTick-Gateway
spring.cloud.gateway.metrics.enabled=true

# Disable autoconfiguration not needed for gateway
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true

# Logging
logging.level.org.springframework.cloud.gateway=INFO
logging.level.reactor.netty.http.client=INFO
logging.level.com.yowyob.tiibntick.gofreelancer.core.gateway=DEBUG
