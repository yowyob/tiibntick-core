spring.application.name=TiiBnTick

# Server
server.port=${SERVER_PORT:8081}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Disable Docker Compose auto-start for manual control
spring.docker.compose.enabled=false

spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# R2DBC PostgreSQL
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:tiibntick}
spring.r2dbc.username=${DB_USERNAME}
spring.r2dbc.password=${DB_PASSWORD}

# JDBC (Liquibase)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:tiibntick}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Liquibase
spring.liquibase.change-log=classpath:/db/changelog/tnt-gofp-master.xml
spring.liquibase.enabled=true

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=tiibntick-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Elasticsearch
spring.elasticsearch.enabled=${ELASTICSEARCH_ENABLED:true}
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms


# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email expediteur
spring.mail.from=${MAIL_USERNAME}

# Admin credentials
admin.email=${MAIL_USERNAME}
admin.password=${MAIL_PASSWORD}

# App
app.base-url=${APP_BASE_URL:http://localhost:8081}

# Logging
logging.level.org.springframework.r2dbc=INFO
logging.level.liquibase=INFO
logging.level.org.springframework.kafka=INFO
logging.level.com.yowyob.tiibntick.gofreelancer.core=DEBUG

# WebFlux Buffer Limit
spring.codec.max-in-memory-size=25MB

# KYC document verification endpoint (tnt-actor-core)
kyc.verify.url=${KYC_VERIFY_URL:http://localhost:8080/api/v1/kyc/verify}


# ── Sentiment Analysis (DJL + nlptown/bert-base-multilingual-uncased-sentiment) ──
# Set enabled=false to force keyword-based fallback (no model download)
tnt.sentiment.enabled=${TNT_SENTIMENT_ENABLED:true}
# HuggingFace model ID served via DJL model zoo
tnt.sentiment.model-name=${TNT_SENTIMENT_MODEL_NAME:nlptown/bert-base-multilingual-uncased-sentiment}
# Directory where DJL caches downloaded models — mount a Docker volume here
tnt.sentiment.cache-dir=${TNT_SENTIMENT_CACHE_DIR:/app/.djl.ai}
