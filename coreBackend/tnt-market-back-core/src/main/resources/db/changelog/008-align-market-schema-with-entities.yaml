databaseChangeLog:
  - changeSet:
      id: 008-align-market-orders-with-entity
      author: MANFOUO Braun
      labels: market-schema-008
      comment: >
        The market_orders entity maps columns that 00x never created (found by the lot L8 wiring test: every read of a
        market order by delivery failed with "column market_orders.mission_id does not exist"). Additive only: the
        columns of the entity are added, the former ones are kept.
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE tnt_market.market_orders
                  ADD COLUMN IF NOT EXISTS mission_id UUID,
                  ADD COLUMN IF NOT EXISTS distance_fee BIGINT,
                  ADD COLUMN IF NOT EXISTS weight_fee BIGINT,
                  ADD COLUMN IF NOT EXISTS insurance_fee BIGINT,
                  ADD COLUMN IF NOT EXISTS express_fee BIGINT,
                  ADD COLUMN IF NOT EXISTS discount_amount BIGINT,
                  ADD COLUMN IF NOT EXISTS transaction_ref VARCHAR(255),
                  ADD COLUMN IF NOT EXISTS mobile_money_phone VARCHAR(255),
                  ADD COLUMN IF NOT EXISTS pickup_street VARCHAR(255),
                  ADD COLUMN IF NOT EXISTS pickup_district VARCHAR(255),
                  ADD COLUMN IF NOT EXISTS pickup_city VARCHAR(255),
                  ADD COLUMN IF NOT EXISTS pickup_country VARCHAR(255),
                  ADD COLUMN IF NOT EXISTS pickup_postal_code VARCHAR(255),
                  ADD COLUMN IF NOT EXISTS pickup_lat DOUBLE PRECISION,
                  ADD COLUMN IF NOT EXISTS pickup_lng DOUBLE PRECISION,
                  ADD COLUMN IF NOT EXISTS pickup_landmark VARCHAR(255),
                  ADD COLUMN IF NOT EXISTS delivery_street VARCHAR(255),
                  ADD COLUMN IF NOT EXISTS delivery_district VARCHAR(255),
                  ADD COLUMN IF NOT EXISTS delivery_city VARCHAR(255),
                  ADD COLUMN IF NOT EXISTS delivery_country VARCHAR(255),
                  ADD COLUMN IF NOT EXISTS delivery_postal_code VARCHAR(255),
                  ADD COLUMN IF NOT EXISTS delivery_lat DOUBLE PRECISION,
                  ADD COLUMN IF NOT EXISTS delivery_lng DOUBLE PRECISION,
                  ADD COLUMN IF NOT EXISTS delivery_landmark VARCHAR(255),
                  ADD COLUMN IF NOT EXISTS parcel_description TEXT,
                  ADD COLUMN IF NOT EXISTS weight_kg DOUBLE PRECISION,
                  ADD COLUMN IF NOT EXISTS length_cm DOUBLE PRECISION,
                  ADD COLUMN IF NOT EXISTS width_cm DOUBLE PRECISION,
                  ADD COLUMN IF NOT EXISTS height_cm DOUBLE PRECISION,
                  ADD COLUMN IF NOT EXISTS value_xaf DOUBLE PRECISION,
                  ADD COLUMN IF NOT EXISTS fragile BOOLEAN NOT NULL DEFAULT FALSE,
                  ADD COLUMN IF NOT EXISTS perishable BOOLEAN NOT NULL DEFAULT FALSE,
                  ADD COLUMN IF NOT EXISTS requires_insurance BOOLEAN NOT NULL DEFAULT FALSE,
                  ADD COLUMN IF NOT EXISTS quantity INTEGER NOT NULL DEFAULT 1,
                  ADD COLUMN IF NOT EXISTS desired_delivery_at TIMESTAMP WITH TIME ZONE,
                  ADD COLUMN IF NOT EXISTS special_instructions TEXT;
              -- the delivery and the payment reference were created under other names (004): carry them over
              UPDATE tnt_market.market_orders SET mission_id = delivery_mission_id::uuid
               WHERE mission_id IS NULL
                 AND delivery_mission_id ~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$';
              UPDATE tnt_market.market_orders SET transaction_ref = transaction_id
               WHERE transaction_ref IS NULL AND transaction_id IS NOT NULL;
              CREATE INDEX IF NOT EXISTS idx_market_orders_mission_tenant ON tnt_market.market_orders (mission_id, tenant_id);
