  - changeSet:
      id: 008-add-market-optimistic-lock-versions
      author: MANFOUO Braun
      labels: market-schema-008
      comment: >
        The @Version column of five market entities was never created ("column market_orders.version does not
        exist"). Default 1: the first version Spring Data gives a primitive version on insert, so an existing row is
        not taken for a new one.
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE tnt_market.market_orders ADD COLUMN IF NOT EXISTS version BIGINT NOT NULL DEFAULT 1;
              ALTER TABLE tnt_market.service_offers ADD COLUMN IF NOT EXISTS version BIGINT NOT NULL DEFAULT 1;
              ALTER TABLE tnt_market.provider_reviews ADD COLUMN IF NOT EXISTS version BIGINT NOT NULL DEFAULT 1;
              ALTER TABLE tnt_market.merchant_contracts ADD COLUMN IF NOT EXISTS version BIGINT NOT NULL DEFAULT 1;
              ALTER TABLE tnt_market.market_campaigns ADD COLUMN IF NOT EXISTS version BIGINT NOT NULL DEFAULT 1;
