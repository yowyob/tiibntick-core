# ==============================================================
#  TIIBNTICK-CORE — kernel/ERP (monolithe modulaire) PRODUCTION
# ==============================================================
#  Resource server : valide les JWT via la JWKS de kernel-core, et relaie vers
#  kernel-core (client tibntick-backend). Exposé sur tiibntick-core.yowyob.com.
#
#  INFRA ENTIÈREMENT PARTAGÉE — ce fichier ne crée AUCUN conteneur d'infra.
#  Postgres `database`, Redis `kernel-core-redis-1`, Elasticsearch
#  `kernel-core-elasticsearch-1`, MinIO `kernel-core-minio-1`, Kafka
#  `yowyob-shared-kafka`. Les trois annexes privées (Postgres/Redis/MinIO) ont été
#  retirées le 2026-09-07 : la base a été migrée telle quelle dans le cluster
#  partagé (194 tables, comptages de lignes vérifiés un à un) et l'unique seau
#  MinIO recréé sous un compte de service limité à ce seul seau.
# ==============================================================
services:

  tnt-core:
    image: "${APP_IMAGE:?APP_IMAGE requis - ex ghcr.io/yowyob/tiibntick-core:main}"
    container_name: tiibntick-core
    pull_policy: always
    restart: unless-stopped
    env_file: [.env]
    environment:
      SERVER_PORT: "8080"
      SERVER_FORWARD_HEADERS_STRATEGY: "framework"
      SWAGGER_SERVER_URL: "https://tiibntick-core.yowyob.com"
      CORS_ALLOWED_ORIGINS: "https://tiibntick.yowyob.com,https://tiibntick-market.yowyob.com,https://tiibntick-link.yowyob.com,https://tiibntick-go.yowyob.com,https://tiibntick-point.yowyob.com,https://tiibntick-agency.yowyob.com"
      # ── Postgres partagé (conteneur `database`, PG18) ──
      # Le rôle `tiibntick` y est volontairement NOSUPERUSER / NOCREATEDB / NOBYPASSRLS :
      # il n'est plus le superutilisateur de son propre serveur, il cohabite avec les
      # autres bases du cluster. D'où DB_AUTO_CREATE_DATABASE à false — la base est
      # créée et possédée en amont, l'application n'a pas à la fabriquer.
      DB_HOST: "database"
      DB_PORT: "5432"
      DB_NAME: "tiibntick_core"
      DB_USER: "tiibntick"
      DB_PASSWORD: "${TNT_CORE_DB_PASSWORD:?TNT_CORE_DB_PASSWORD requis dans .env}"
      DB_SSL_MODE: "disable"
      DB_AUTO_CREATE_DATABASE: "false"
      # ── Redis partagé ──
      # L'application n'expose que host/port/password : l'index de base se règle par la
      # propriété Spring elle-même. Index 3 pour ne pas partager l'espace de clés du
      # noyau, qui n'utilise que db0.
      REDIS_HOST: "kernel-core-redis-1"
      REDIS_PORT: "6379"
      SPRING_DATA_REDIS_DATABASE: "3"
      # ── Kafka partagé ──
      KAFKA_BOOTSTRAP: "yowyob-shared-kafka:9092"
      KAFKA_REPLICATION: "1"
      # ── Elasticsearch partagé ──
      # La recherche Go Freelancer reste désactivée, mais l'auto-configuration Spring
      # sonde l'URI quoi qu'il arrive : la laisser sur localhost:9200 maintenait
      # /actuator/health en DOWN permanent, ce qui masque les vraies pannes.
      ELASTICSEARCH_ENABLED: "false"
      ELASTICSEARCH_URIS: "http://kernel-core-elasticsearch-1:9200"
      # ── MinIO partagé (média) ──
      # Compte de service limité au seul seau tnt-incident-evidences, pas le compte root.
      MINIO_ENDPOINT: "http://kernel-core-minio-1:9000"
      MINIO_PUBLIC_ENDPOINT: "http://kernel-core-minio-1:9000"
      MINIO_ACCESS_KEY: "${TNT_MINIO_ACCESS_KEY:?TNT_MINIO_ACCESS_KEY requis dans .env}"
      MINIO_SECRET_KEY: "${TNT_MINIO_SECRET_KEY:?TNT_MINIO_SECRET_KEY requis dans .env}"
      # ── Sécurité JWT : resource server valide via la JWKS de kernel-core ──
      # Volontairement jwk-set-uri SEUL, sans issuer-uri : le noyau émet iss:"kernel-core",
      # qui n'est pas une URL, donc la découverte OIDC de Spring ne peut pas s'en servir.
      # La signature et l'expiration sont vérifiées ; le claim iss ne l'est pas.
      JWT_JWK_SET_URI: "https://kernel-core.yowyob.com/kernel-api/.well-known/jwks.json"
      JWT_AUTO_GENERATE_KEY_PAIR: "true"
      QR_HMAC_SECRET: "${TNT_CORE_QR_HMAC_SECRET:?TNT_CORE_QR_HMAC_SECRET requis dans .env}"
      # ── Relais vers kernel-core (client dédié, cf. .env.prod.example) ──
      TNT_KERNEL_BASE_URL: "https://kernel-core.yowyob.com/kernel-api"
      TNT_KERNEL_CLIENT_ID: "tibntick-backend"
      TNT_KERNEL_API_KEY: "${TNT_KERNEL_API_KEY:?TNT_KERNEL_API_KEY requis dans .env}"
      # Valeur réelle fournie par le .env du serveur : ne jamais figer un gabarit ici,
      # le job de déploiement recopie ce fichier et écraserait le correctif appliqué à la main.
      TNT_SYSTEM_TENANT_ID: "${TNT_SYSTEM_TENANT_ID:?TNT_SYSTEM_TENANT_ID requis dans .env}"
      # ── Variables applicatives reprises de tnt-bootstrap/.env.prod.example ──
      # (on n'active PAS le profil prod : il désactive Swagger et exige Postgres TLS +
      #  clé JWT montée, non disponibles ici.)
      TNT_AUTH_SERVICE_CODE: "TNT_AGENCY"
      JWT_KEY_ID: "tnt-core-key-prod"
      DB_POOL_INITIAL_SIZE: "2"
      DB_POOL_MAX_SIZE: "10"
      DB_POOL_MAX_IDLE_MINUTES: "30"
    healthcheck:
      # UNIQUEMENT liveness. Le repli vers l'agrégat /actuator/health a été retiré : cet
      # endpoint FUIT des connexions à la base. TntDatabasePyramidHealthIndicator fait
      # `.doFinally(s -> conn.close())`, or en R2DBC `close()` renvoie un Publisher qui ne
      # fait rien tant qu'on ne s'y abonne pas — la connexion n'est jamais rendue au pool.
      # Mesuré le 2026-09-07 : 7 connexions au repos, 21 après UN SEUL appel, plafond à 24
      # puis « Connection acquisition timed out » sur tout le service jusqu'au redémarrage.
      # Pendant le start_period, liveness n'existe pas encore : le repli s'exécutait toutes
      # les 20 s et vidait le pool à lui seul. Correctif applicatif à faire en amont
      # (souscrire à close(), p. ex. `Mono.usingWhen`).
      test: ["CMD-SHELL", "curl -sf -o /dev/null --max-time 8 http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 180s
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "5" }
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tnt-core.rule=Host(`tiibntick-core.yowyob.com`)"
      - "traefik.http.routers.tnt-core.entrypoints=websecure"
      - "traefik.http.routers.tnt-core.tls=true"
      - "traefik.http.routers.tnt-core.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tnt-core.priority=100"
      - "traefik.http.services.tnt-core.loadbalancer.server.port=8080"
      - "traefik.docker.network=yowyob"
    # `yowyob` porte Traefik, `database` et Kafka ; `kernel-network` porte Redis,
    # Elasticsearch et MinIO du noyau. Aucun réseau propre à ce service.
    networks: [yowyob, kernel-network]

networks:
  yowyob:
    external: true
    name: yowyob
  kernel-network:
    external: true
    name: kernel-network
