databaseChangeLog:
  - changeSet:
      id: 009-add-response-dedup-index
      author: MANFOUO BRAUN
      comment: >
        Composite index (announcement_id, delivery_person_id) on tnt_announcement_responses.
        Supports the hasFreelancerResponded EXISTS query in DeliveryAnnouncementRepositoryAdapter
        without a sequential scan, and aligns with the uq_announcement_delivery_person
        unique constraint already present on announcement_subscriptions.
      changes:
        - createIndex:
            indexName: idx_tnt_resp_ann_person
            tableName: tnt_announcement_responses
            columns:
              - column:
                  name: announcement_id
              - column:
                  name: delivery_person_id
